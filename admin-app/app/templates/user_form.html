{% extends "base.html" %}
{% block content %}
<h2>{{ "Edit User" if editing else "New User" }}</h2>

<form method="post" class="mt-3" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">User ID (slug, e.g. "ndr")</label>
        <input type="text" name="user_id" class="form-control" value="{{ user_data.get('user_id', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user_data.get('email', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Telegram ID</label>
        <input type="text" name="telegram_id" class="form-control" value="{{ user_data.get('telegram', '') }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ user_data.get('name', '') }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
            <option value="employee" {% if user_data.get('role') == 'employee' %}selected{% endif %}>Employee</option>
            <option value="admin" {% if user_data.get('role') == 'admin' %}selected{% endif %}>Admin</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/users" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
