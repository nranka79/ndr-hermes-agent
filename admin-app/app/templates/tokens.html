{% extends "base.html" %}
{% block content %}
<h2>Tokens</h2>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>User</th>
            <th>Service</th>
            <th>Label</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for t in user_tokens %}
        <tr>
            <td><a href="/users/{{ t.user_id }}">{{ t.name }}</a></td>
            <td><code>{{ t.service }}</code></td>
            <td>{{ t.label }}</td>
            <td>
                <form method="post" action="/tokens/{{ t.user_id }}/{{ t.service }}/delete" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Revoke this token?')">Revoke</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-muted">No tokens found</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
