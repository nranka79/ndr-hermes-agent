<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 60px; }
        .sidebar { min-height: calc(100vh - 60px); }
        .token-dot { color: #6c757d; font-family: monospace; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Hermes Admin</a>
            <div class="d-flex">
                {% if user %}
                <span class="navbar-text me-3">{{ user.name }}</span>
                <a href="/auth/logout" class="btn btn-outline-light btn-sm">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            {% if user %}
            <nav class="col-md-2 d-none d-md-block bg-light sidebar pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tokens">Tokens</a></li>
                    <li class="nav-item"><a class="nav-link" href="/health">Health</a></li>
                </ul>
            </nav>
            <main class="col-md-10 ms-sm-auto px-4 pt-3">
            {% else %}
            <main class="col-12 px-4 pt-3">
            {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
