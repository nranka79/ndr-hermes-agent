server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Parse HERMES_AUDIT structured JSON lines from hermes container
      - match:
          selector: '{container="hermes"}'
          stages:
            - json:
                expressions:
                  audit_event: event
                  user_email: user_email
                  user_name: user_name
                  user_id: user_id
                  role: role
                  session_key: session_key
            - labels:
                audit_event:
                  source: audit_event
                user_email:
                  source: user_email
                role:
                  source: role
