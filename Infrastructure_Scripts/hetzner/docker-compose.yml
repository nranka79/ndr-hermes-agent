services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    build:
      context: ./n8n-custom
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_USERNAME: default
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EDITOR_BASE_URL: https://transcribe.ahfl.in
      WEBHOOK_URL: https://transcribe.ahfl.in
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_LISTEN_ADDRESS: "::"
      HERMES_WEBHOOK_TOKEN: ${HERMES_WEBHOOK_TOKEN}
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      NODE_OPTIONS: "--max_old_space_size=2048"
    volumes:
      - ./n8n-data:/home/node/.n8n

  n8n-worker:
    build:
      context: ./n8n-custom
      dockerfile: Dockerfile
    restart: always
    command: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_USERNAME: default
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      NODE_OPTIONS: "--max_old_space_size=1024"

  hermes:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    restart: always
    command: ["sh", "-c", "python3 /data/hermes/bin/minimax-embed-proxy.py &
      exec hermes gateway run -v"]
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      HERMES_HOME: /data/hermes
      PYTHONUNBUFFERED: "1"
      NO_COLOR: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      HERMES_N8N_TOKEN: ${HERMES_N8N_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEEPSEEK_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      GBRAIN_DATABASE_URL: ${GBRAIN_DATABASE_URL}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      GEMINI_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      HERMES_FORCE_SKILL_SYNC: ${HERMES_FORCE_SKILL_SYNC}
      # Per-user OAuth for Gmail/Calendar (replaces old per-account refresh tokens)
      HERMES_OAUTH_CLIENT_ID: ${HERMES_OAUTH_CLIENT_ID}
      HERMES_OAUTH_CLIENT_SECRET: ${HERMES_OAUTH_CLIENT_SECRET}
      # API server for OAuth callback (key required for 0.0.0.0 binding)
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY}
      CAMOFOX_URL: http://camofox:9377
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      APIFY_API_KEY: ${APIFY_API_KEY}
      # GWS Token Vault — access tokens stored outside container
      GWS_VAULT_SECRET: ${GWS_VAULT_SECRET}
      GWS_VAULT_SOCKET: /run/gws-vault/vault.sock
    volumes:
      - ./hermes-data:/data/hermes
      - ./hermes-agent/tools:/opt/hermes/tools
      - ./hermes-agent/skills:/opt/hermes/skills
      - ./hermes-agent/gateway/authz_mixin.py:/opt/hermes/gateway/authz_mixin.py
      - "/opt/hermes/hermes-agent/gateway/run.py:/opt/hermes/gateway/run.py:ro"
      # Pilot: subagent-polling fix (Jun 2026) — bind-mount the edited source
      # files so they survive container recreations. Remove these lines
      # once the fix is baked into the Docker image and the image is rebuilt.
      - ./hermes-agent/hermes_state.py:/opt/hermes/hermes_state.py:ro
      - ./hermes-agent/gateway/platforms/api_server.py:/opt/hermes/gateway/platforms/api_server.py:ro
      - /run/gws-vault:/run/gws-vault
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "hermes"

  smart-browser:
    build:
      context: ./smart-browser
      dockerfile: Dockerfile
    restart: always
    environment:
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}

  voice:
    build:
      context: ./voice-app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BASE_URL: https://voice.ahfl.in
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CLEANTEXT_WEBHOOK_URL: ${CLEANTEXT_WEBHOOK_URL}
      PROCESS_WEBHOOK_URL: ${PROCESS_WEBHOOK_URL}
      SAVE_WEBHOOK_URL: ${SAVE_WEBHOOK_URL}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL}
      AUTH_FILE: /data/.auth
      # Free Whisper microservice — reachable by compose service name on
      # the shared default network (same pattern as OPENAI_API_BASE_URL:
      # http://hermes:8642/v1 below).
      FREE_WHISPER_URL: http://free-whisper:8000
    volumes:
      - ./voice-data:/data
    depends_on:
      - free-whisper

  # Free Whisper — isolated faster-whisper transcription microservice.
  # Pilot (Phase 1): plain transcription only, called by the `voice` app's
  # new "Free Whisper" button. No vault/vocab wiring yet (Phase 2).
  free-whisper:
    build:
      context: ./free-whisper-svc
      dockerfile: Dockerfile
    restart: always
    environment:
      WHISPER_MODEL: small
    volumes:
      # Reuse the faster-whisper model cache already downloaded for the
      # `hermes` container's own local STT (same "small" model) so this
      # service doesn't re-download ~500MB on first start.
      - ./hermes-data/home/.cache/huggingface:/root/.cache/huggingface

  loki:
    image: grafana/loki:2.9.4
    restart: always
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - ./loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.4
    restart: always
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./monitoring/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:10.4.2
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://monitor.ahfl.in
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: always
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".monitor.ahfl.in"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "https://monitor.ahfl.in/oauth2/callback"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: "/etc/oauth2-proxy/emails.txt"
      # OAUTH2_PROXY_UPSTREAMS: "http://hermes:9119"  # dashboard removed 2026-06-27
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    volumes:
      - ./secrets/oauth2-proxy-emails.txt:/etc/oauth2-proxy/emails.txt:ro

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    environment:
      WEBUI_AUTH: "true"
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: "X-Forwarded-Email"
      WEBUI_AUTH_TRUSTED_NAME_HEADER: "X-Forwarded-User"
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      OPENAI_API_BASE_URL: "http://hermes:8642/v1"
      OPENAI_API_KEY: ${API_SERVER_KEY}
      WEBUI_SECRET_KEY: ${CHAT_WEBUI_SECRET}
      WEBUI_NAME: "Hermes"
      DEFAULT_MODELS: "hermes-agent"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_MESSAGE_RATING: "false"
      ENABLE_MODEL_FILTER: "false"
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://voice:3000/v1"
      AUDIO_STT_OPENAI_API_KEY: "voice-bridge"
      AUDIO_STT_MODEL: "whisper-1"
    volumes:
      - ./chat-data:/app/backend/data
    depends_on:
      - hermes
      - voice

  oauth2-proxy-chat:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: always
    ports:
      - "127.0.0.1:4181:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".ahfl.in"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_proxy_chat"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "https://chat.ahfl.in/oauth2/callback"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: "/etc/oauth2-proxy/emails.txt"
      OAUTH2_PROXY_UPSTREAMS: "http://open-webui:8080"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
    volumes:
      - ./secrets/chat-emails.txt:/etc/oauth2-proxy/emails.txt:ro
    depends_on:
      - open-webui
