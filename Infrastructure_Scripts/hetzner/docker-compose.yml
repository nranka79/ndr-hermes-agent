services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    build:
      context: ./n8n-custom
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_USERNAME: default
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EDITOR_BASE_URL: https://transcribe.ahfl.in
      WEBHOOK_URL: https://transcribe.ahfl.in
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_LISTEN_ADDRESS: "::"
      GOOGLE_SA_KEY: ${GOOGLE_SA_KEY}
      HERMES_WEBHOOK_TOKEN: ${HERMES_WEBHOOK_TOKEN}
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      NODE_OPTIONS: "--max_old_space_size=2048"
    volumes:
      - ./n8n-data:/home/node/.n8n

  n8n-worker:
    build:
      context: ./n8n-custom
      dockerfile: Dockerfile
    restart: always
    command: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_USERNAME: default
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      GOOGLE_SA_KEY: ${GOOGLE_SA_KEY}
      NODE_OPTIONS: "--max_old_space_size=1024"

  hermes:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    restart: always
    command: ["sh", "-c", "python3 setup_oauth_credentials.py && exec hermes gateway run -v"]
    environment:
      HERMES_HOME: /data/hermes
      PYTHONUNBUFFERED: "1"
      NO_COLOR: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      HERMES_N8N_TOKEN: ${HERMES_N8N_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      GEMINI_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      GOOGLE_SA_KEY: ${GOOGLE_SA_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      DRAAS_OAUTH_CLIENT_ID: ${DRAAS_OAUTH_CLIENT_ID}
      DRAAS_OAUTH_CLIENT_SECRET: ${DRAAS_OAUTH_CLIENT_SECRET}
      DRAAS_OAUTH_REFRESH_TOKEN: ${DRAAS_OAUTH_REFRESH_TOKEN}
      AHFL_OAUTH_CLIENT_ID: ${AHFL_OAUTH_CLIENT_ID}
      AHFL_OAUTH_CLIENT_SECRET: ${AHFL_OAUTH_CLIENT_SECRET}
      AHFL_OAUTH_REFRESH_TOKEN: ${AHFL_OAUTH_REFRESH_TOKEN}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN}
      HERMES_FORCE_SKILL_SYNC: ${HERMES_FORCE_SKILL_SYNC}
    volumes:
      - ./hermes-data:/data/hermes
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "hermes"

  smart-browser:
    build:
      context: ./smart-browser
      dockerfile: Dockerfile
    restart: always
    environment:
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}

  voice:
    build:
      context: ./voice-app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BASE_URL: https://voice.ahfl.in
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CLEANTEXT_WEBHOOK_URL: ${CLEANTEXT_WEBHOOK_URL}
      PROCESS_WEBHOOK_URL: ${PROCESS_WEBHOOK_URL}
      SAVE_WEBHOOK_URL: ${SAVE_WEBHOOK_URL}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL}
      AUTH_FILE: /data/.auth
    volumes:
      - ./voice-data:/data

  loki:
    image: grafana/loki:2.9.4
    restart: always
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - ./loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.4
    restart: always
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./monitoring/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:10.4.2
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://monitor.ahfl.in
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
