server {
    server_name admin.ahfl.in;

    # Hermes tunnel live dashboard — proxied through the admin-app
    # (localhost:8081), which enforces the SAME Google SSO as the rest of
    # this panel (ADMIN_EMAILS allowlist — ndr@draas.com). The admin-app
    # adds the router bearer token server-side; browsers never see it.
    location /tunnel/ {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Old / wrong-host Bhoomi map links -> canonical host
    location ~ ^/(v|o)/ {
        return 301 https://bhoomi.ahfl.in$request_uri;
    }

    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.ahfl.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.ahfl.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = admin.ahfl.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.ahfl.in;
    return 404; # managed by Certbot


}
