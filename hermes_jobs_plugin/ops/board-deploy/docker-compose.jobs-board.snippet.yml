# Live jobs-board + jobs-oauth2-proxy blocks, synced from the server on
# 2026-11-01 (added jobs-board's own log volume -- see inline comment).
# The canonical compose file is hermes-apps-stack/docker-compose.prod.yml;
# this snippet exists so the plugin's deploy notes stay readable on their
# own.
#
# Two isolated services. Neither touches hermes-hermes-1 or
# hermes-apps-1. Both join the implicit default project network
# (hermes_default), same as every other service in the file.
#
# board_server.py and static/ ride along for free: they live under
# /opt/hermes/hermes-data/plugins/hermes_jobs/, which is the SAME host
# path already bind-mounted as /data/hermes everywhere else. No new
# bind-mount, no custom image, no Dockerfile.

  jobs-board:
    image: hermes-hermes:latest
    container_name: hermes-jobs-board-1
    restart: always
    command: ["python3", "/data/hermes/plugins/hermes_jobs/board_server.py"]
    working_dir: /data/hermes/plugins/hermes_jobs
    ports:
      - "127.0.0.1:8900:8900"
    volumes:
      - /opt/hermes/hermes-data:/data/hermes
      # gws-vault runs on the HOST as systemd; the socket is bind-mounted in
      # read-only so authz.py can resolve email aliases and check role=admin.
      - /run/gws-vault:/run/gws-vault:ro
      # This image's s6 scaffolding starts regardless of `command` and
      # tries to run a "gateway-default" log service at
      # $HERMES_HOME/logs/gateways/default -- with HERMES_HOME shared
      # above, that collided with hermes-hermes-1's OWN gateway-default
      # log service writing to the SAME bind-mounted host path (two
      # containers' s6-log fighting over one lock file: "unable to lock
      # ... Resource busy", spamming both containers' logs). This board
      # service is not the real gateway and has nothing worth keeping in
      # that log stream, so it gets its own private, non-shared directory
      # instead of silently stepping on hermes-hermes-1's real app logs
      # (gateway.log/errors.log/agent.log also live under the same
      # shared /data/hermes/logs, so this was two containers' app-level
      # logging interleaved into one file, not just a lock collision).
      - /opt/hermes/hermes-jobs-board-logs:/data/hermes/logs
    environment:
      BOARD_PORT: "8900"
      # Pin explicitly -- the hermes-hermes:latest image bakes in
      # HERMES_HOME=/opt/data by default; the hermes service overrides
      # it to /data/hermes, this one never did, so it silently
      # auto-created an empty kanban.db in its own container layer.
      HERMES_HOME: /data/hermes
      HERMES_KANBAN_DB: /data/hermes/kanban.db
      # Per-user job visibility: resolve email -> vault identity aliases and
      # allow the All jobs view only for a strict vault role=admin.
      GWS_VAULT_SOCKET: /run/gws-vault/vault.sock
      # Jobs-page dictation uses the same STT provider chain as
      # voice.ahfl.in / chat.ahfl.in, but through the AI Model Gateway
      # (llm-gateway) so it shares the central Groq -> AssemblyAI pools.
      # Fallbacks keep dictation working if that route is down; all three
      # are OpenAI-compatible multipart endpoints.
      HERMES_STT_URL: "http://llm-gateway:8321/v1/audio/transcriptions"
      HERMES_STT_FALLBACK_URLS: "http://hermes-apps:3000/v1/audio/transcriptions,http://hermes-apps:8100/v1/audio/transcriptions"
      # Dictation redraft + sheet/AI noun correction (same n8n webhook
      # voice.ahfl.in's email-reformat button and the WhatsApp voice
      # workflows use). Optional -- unset/unreachable falls back to the
      # raw transcript, never blocks dictation.
      CLEANTEXT_WEBHOOK_URL: ${CLEANTEXT_WEBHOOK_URL}
      # Deliberately NOT API_SERVER_KEY / HERMES_API_BASE -- this service
      # only reads/writes kanban.db. Job rows it inserts are claimed and run
      # by the gateway's existing hermes-jobs runner loop (same path as
      # Telegram /job), so no direct /v1/runs call is needed here.

  jobs-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: hermes-jobs-oauth2-proxy-1
    restart: always
    depends_on:
      - jobs-board
    ports:
      - "127.0.0.1:4182:4180"
    volumes:
      - /opt/hermes/oauth2-proxy-jobs/emails.txt:/etc/oauth2-proxy/emails.txt:ro
    environment:
      # Reuses the SAME Google OAuth client as chat.ahfl.in (NDR adding
      # https://jobs.ahfl.in/oauth2/callback as an additional authorized
      # redirect URI on that client in Google Cloud Console -- a client
      # supports multiple redirect URIs, no new OAuth app needed).
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Fresh secret, NOT shared with chat's -- separate app, separate
      # session material. Generate with: openssl rand -base64 32 | cut -c1-32
      OAUTH2_PROXY_COOKIE_SECRET: ${JOBS_OAUTH2_PROXY_COOKIE_SECRET}
    # client-id / client-secret / cookie-secret are deliberately NOT passed
    # as entrypoint flags: oauth2-proxy natively reads the OAUTH2_PROXY_*
    # env vars set above (OAUTH2_PROXY_CLIENT_ID -> --client-id, etc).
    # Passing them again here would just be a second, redundant (and
    # earlier, broken-syntax) way of doing the same thing.
    entrypoint:
      - /bin/oauth2-proxy
      - --provider=google
      - --cookie-secure=true
      - --cookie-domain=.ahfl.in
      - --cookie-name=_oauth2_proxy_jobs
      - --http-address=0.0.0.0:4180
      - --redirect-url=https://jobs.ahfl.in/oauth2/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
      - --email-domain=*
      - --skip-provider-button=true
      - --skip-auth-route=^/manifest.json$
      - --skip-auth-route=^/sw.js$
      - --skip-auth-route=^/icons/.*$
      - --reverse-proxy=true
      - --pass-user-headers=true
      - --set-xauthrequest=true
      # 340s: STT worst case (~240s) plus the dictation-cleanup
      # webhook's own 100s budget, which now runs AFTER a successful
      # transcription on the same request -- see jobs.ahfl.in nginx
      # vhost, which matches this value.
      - --upstream-timeout=340s
      - --upstream=http://jobs-board:8900/
