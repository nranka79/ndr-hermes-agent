<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Hermes Jobs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=20261027d">
</head>
<body>
<header class="topbar">
  <h1>Hermes Jobs</h1>
  <div class="topbar-actions">
    <button id="newJobBtn" class="new-job-btn" aria-label="Create a new job" title="Create a new job">+ New job</button>
    <button id="refreshBtn" class="icon-btn" aria-label="Refresh" title="Refresh">&#x21bb;</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-lane="needs_you">Needs you <span class="badge" id="badge-needs_you">0</span></button>
  <button class="tab" data-lane="working">Working <span class="badge" id="badge-working">0</span></button>
  <button class="tab" data-lane="done">Done <span class="badge" id="badge-done">0</span></button>
  <button class="tab" data-lane="dropped">Dropped <span class="badge" id="badge-dropped">0</span></button>
</nav>

<main class="jobs-wrap">
  <div class="jobs-head" id="jobsHead">
    <div>Status</div>
    <div>Job</div>
    <div>Detail</div>
    <div>Origin</div>
    <div>Created</div>
    <div></div>
  </div>
  <div id="list" class="jobs-list">
    <p class="empty">Loading...</p>
  </div>
</main>

<div id="jobModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-card" role="document">
    <header class="modal-head">
      <div class="modal-heading">
        <div class="modal-kicker" id="jobModalStatus"></div>
        <h2 id="jobModalTitle">Job</h2>
      </div>
      <button class="icon-btn modal-close" data-close-modal aria-label="Close">&times;</button>
    </header>
    <div class="modal-body" id="jobModalBody"></div>
  </div>
</div>

<div id="composerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="composerTitle">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-card modal-card-narrow" role="document">
    <header class="modal-head">
      <div class="modal-heading">
        <div class="modal-kicker" id="composerKicker">New job</div>
        <h2 id="composerTitle">What should Hermes do?</h2>
      </div>
      <button class="icon-btn modal-close" data-close-modal aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <label class="field-label" for="composerInstruction">Job instruction</label>
      <div class="compose-row">
        <textarea id="composerInstruction" class="input textarea composer-textarea" placeholder="Describe the job, or tap the mic and dictate..."></textarea>
        <button class="mic-btn" data-mic-for="composerInstruction" title="Dictate" aria-label="Dictate job">&#127908;</button>
      </div>

      <div id="composerFeedbackWrap" class="hidden">
        <label class="field-label" for="composerFeedback">Changes / additional feedback</label>
        <div class="compose-row">
          <textarea id="composerFeedback" class="input textarea feedback-textarea" placeholder="What should change? Anything else Hermes should know? (optional)"></textarea>
          <button class="mic-btn" data-mic-for="composerFeedback" title="Dictate" aria-label="Dictate feedback">&#127908;</button>
        </div>
      </div>

      <p class="hint" id="composerHint">Runs in the background. Open the job later to read the final reply.</p>

      <div class="modal-actions">
        <button class="btn btn-primary" id="composerSubmit">Create job</button>
        <button class="btn btn-secondary" id="composerCancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=20261027d"></script>
</body>
</html>
