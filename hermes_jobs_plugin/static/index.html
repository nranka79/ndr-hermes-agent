<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Hermes Jobs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Hermes Jobs</h1>
  <button id="refreshBtn" class="icon-btn" aria-label="Refresh" title="Refresh">&#x21bb;</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-lane="needs_you">Needs you <span class="badge" id="badge-needs_you">0</span></button>
  <button class="tab" data-lane="working">Working <span class="badge" id="badge-working">0</span></button>
  <button class="tab" data-lane="done">Done <span class="badge" id="badge-done">0</span></button>
  <button class="tab" data-lane="dropped">Dropped <span class="badge" id="badge-dropped">0</span></button>
</nav>

<main id="list" class="card-list">
  <p class="empty" id="emptyMsg">Loading...</p>
</main>

<!-- Detail sheet (slides up on mobile, modal on desktop) -->
<div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
<section id="sheet" class="sheet hidden" aria-hidden="true">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-content">
    <div class="sheet-header">
      <h2 id="sheetTitle">Job</h2>
      <button id="sheetClose" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
