<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{PROJECT_NAME}} — WhatsApp Sender</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f0eb;
    min-height: 100vh;
    padding: 12px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    max-width: 560px;
    margin: 0 auto;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #5c3a1e, #8b5e34);
    color: #fff;
    padding: 18px 20px 16px;
  }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .image-section {
    position: relative;
    width: 100%;
    background: #2a1a0a;
    line-height: 0;
  }
  .image-section img {
    width: 100%;
    display: block;
  }
  .image-section .save-badge {
    position: absolute;
    bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    pointer-events: none;
  }
  .body { padding: 18px 20px 22px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #3a2a1a;
    margin-bottom: 4px;
  }
  .phone-row {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
  }
  .country-code {
    background: #f0ebe6;
    border: 1px solid #d4c9be;
    border-right: none;
    border-radius: 8px 0 0 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: #5c3a1e;
    font-weight: 600;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .phone-row input {
    flex: 1;
    border: 1px solid #d4c9be;
    border-left: none;
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    min-width: 0;
  }
  .phone-row input:focus { border-color: #8b5e34; }
  .instruction-badge {
    display: flex;
    align-items: center; gap: 8px;
    background: #fef8e7;
    border-left: 3px solid #f5a623;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px; color: #5c4a2a;
    line-height: 1.4;
    margin-bottom: 14px;
  }
  .message-box {
    background: #faf8f6;
    border: 1px solid #d4c9be;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: #2a1a0a;
    margin-bottom: 14px;
    max-height: 220px;
    overflow-y: auto;
  }
  .message-box .label {
    font-weight: 600; font-size: 11px; color: #8b5e34;
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .btn {
    display: block; width: 100%;
    padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    text-align: center; text-decoration: none;
  }
  .btn-primary { background: #25D366; color: #fff; }
  .btn-primary:active { background: #1da954; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: #f0ebe6; color: #5c3a1e;
    margin-top: 8px; font-size: 14px; padding: 10px;
  }
  .btn-secondary:active { background: #e3dbd2; }
  .history {
    margin-top: 16px; border-top: 1px solid #e8e0d8;
    padding-top: 14px;
  }
  .history h3 { font-size: 12px; color: #8b5e34; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .history-list { list-style: none; max-height: 150px; overflow-y: auto; }
  .history-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid #f0ebe6; font-size: 13px;
  }
  .history-list li:last-child { border-bottom: none; }
  .history-list .num { color: #5c3a1e; font-weight: 500; }
  .history-list .ts { color: #b8a898; font-size: 11px; }
  .history-list .link-btn { color: #25D366; text-decoration: none; font-size: 14px; }
  .clear-btn { background: none; border: none; color: #b8a898; font-size: 11px; cursor: pointer; float: right; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📱 {{PROJECT_NAME}}</h1>
    <p>WhatsApp welcome message + image sender</p>
  </div>
  <div class="image-section">
    <img src="{{IMAGE_FILENAME}}" alt="{{PROJECT_NAME}} Welcome" id="welcomeImage">
    <div class="save-badge">📷 Long-press to save</div>
  </div>
  <div class="body">
    <label for="phone">Client Phone Number</label>
    <div class="phone-row">
      <span class="country-code">+91</span>
      <input type="tel" id="phone" placeholder="98741 48000" autofocus inputmode="numeric" pattern="[0-9]*">
    </div>
    <div class="instruction-badge">
      <span>📌</span>
      <span><strong>Workflow:</strong> Tap green button → WhatsApp opens with message pre-filled → attach the <strong>image above</strong> from your gallery → send ✈️</span>
    </div>
    <div class="message-box">
      <div class="label">📝 Message Preview</div>
      <div id="messagePreview">{{MESSAGE_TEXT}}</div>
    </div>
    <button class="btn btn-primary" id="openBtn" disabled>📤 Send via WhatsApp</button>
    <button class="btn btn-secondary" id="copyBtn" disabled>📋 Copy Link</button>
    <div class="history" id="historySection" style="display:none">
      <h3>📋 Recent <button class="clear-btn" id="clearHistory">Clear</button></h3>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>
</div>
<script>
  const phoneInput = document.getElementById('phone');
  const openBtn = document.getElementById('openBtn');
  const copyBtn = document.getElementById('copyBtn');
  const historyList = document.getElementById('historyList');
  const historySection = document.getElementById('historySection');
  const TEMPLATE = document.getElementById('messagePreview').textContent.trim();

  function getPhone() { return phoneInput.value.replace(/[\s\-\#\*\(\)]/g, ''); }
  function getWaLink() { return `https://wa.me/91${getPhone()}?text=${encodeURIComponent(TEMPLATE)}`; }
  function validate() {
    const valid = /^\d{10}$/.test(getPhone());
    openBtn.disabled = !valid; copyBtn.disabled = !valid; return valid;
  }
  function saveHistory(phone) {
    let h = JSON.parse(localStorage.getItem('waHistory') || '[]');
    h.unshift({phone, ts: new Date().toISOString()});
    if (h.length > 50) h = h.slice(0, 50);
    localStorage.setItem('waHistory', JSON.stringify(h)); renderHistory();
  }
  function renderHistory() {
    const h = JSON.parse(localStorage.getItem('waHistory') || '[]');
    if (!h.length) { historySection.style.display = 'none'; return; }
    historySection.style.display = 'block';
    historyList.innerHTML = h.map(e => {
      const link = `https://wa.me/91${e.phone}?text=${encodeURIComponent(TEMPLATE)}`;
      const t = new Date(e.ts).toLocaleString('en-IN', {hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
      return `<li><span class="num">📱 ${e.phone}</span> <span class="ts">${t}</span> <a class="link-btn" href="${link}" target="_blank">↗️</a></li>`;
    }).join('');
  }
  phoneInput.addEventListener('input', validate);
  phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !openBtn.disabled) openBtn.click(); });
  openBtn.addEventListener('click', () => { if (validate()) { saveHistory(getPhone()); window.open(getWaLink(), '_blank'); } });
  copyBtn.addEventListener('click', async () => {
    if (!validate()) return;
    try { await navigator.clipboard.writeText(getWaLink()); copyBtn.textContent = '✅ Copied!'; setTimeout(() => copyBtn.textContent = '📋 Copy Link', 2000); }
    catch { const ta = document.createElement('textarea'); ta.value = getWaLink(); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); copyBtn.textContent = '✅ Copied!'; setTimeout(() => copyBtn.textContent = '📋 Copy Link', 2000); }
  });
  document.getElementById('clearHistory').addEventListener('click', () => { localStorage.removeItem('waHistory'); renderHistory(); });
  const p = new URLSearchParams(window.location.search);
  if (p.get('phone')) { phoneInput.value = p.get('phone'); validate(); }
  validate(); renderHistory();
</script>
</body>
</html>
