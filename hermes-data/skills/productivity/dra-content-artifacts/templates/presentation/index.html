<!doctype html>
<!--
  DRA Content presentation template — Reveal.js 6.0.2 (pinned, vendored,
  audited for CSP compliance: no eval, no new Function, no remote font
  imports, no CDN dependency in the plugins included below).

  Fill in slides between the SLIDES START and SLIDES END markers below.
  Everything else is boilerplate that should not normally need editing.

  Do not add an inline script or style element - the view origin's CSP
  forbids both (script-src 'self'; no unsafe-inline for style either). Put
  custom rules in styles.css and custom logic in app.js, both served
  alongside this file from the same artifact version.

  Never write a comment-open sequence inside this comment. HTML comments do
  not nest: the first close sequence ends it and everything after becomes
  live markup. That exact mistake lived here and silently broke every deck
  ever produced -- the stray script element it created swallowed the
  reveal.js tag, so Reveal was never defined.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Presentation title</title>

<link rel="stylesheet" href="/lib/reveal/reset.css">
<link rel="stylesheet" href="/lib/reveal/reveal.css">
<!-- Approved, CSP-clean themes only: black, black-contrast, white,
     white-contrast, serif, dracula. Others in upstream Reveal.js pull
     Google Fonts via @import and are excluded — see
     APPROVED_FRONTEND_LIBRARIES.md. -->
<link rel="stylesheet" href="/lib/reveal/theme/white.css" id="theme">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="reveal">
  <div class="slides">

    <!-- SLIDES START -->
    <section>
      <h1>Presentation title</h1>
      <p>Subtitle or author line</p>
    </section>

    <section>
      <h2>Section heading</h2>
      <ul>
        <li>Point one</li>
        <li>Point two</li>
        <li>Point three</li>
      </ul>
      <!-- Speaker notes: visible only in the presenter popup (Speaker View),
           opened with the "S" key. Never shown on the main screen. -->
      <aside class="notes">Optional speaker notes for this slide.</aside>
    </section>

    <section>
      <h2>A table</h2>
      <table>
        <thead><tr><th>Item</th><th>Value</th></tr></thead>
        <tbody>
          <tr><td>Example</td><td>123</td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2>A chart</h2>
      <!-- Chart.js 4.5.1, pinned. Canvas-based, no eval, CSP-safe. -->
      <canvas id="chart-1" width="640" height="360"></canvas>
    </section>

    <section>
      <h2>A diagram</h2>
      <!-- Mermaid 12.0.0, pinned. Initialised in app.js, not inline. -->
      <div class="mermaid" data-dra-diagram="diagram-1">
graph TD
  A[Start] --> B{Decision}
  B -->|Yes| C[Continue]
  B -->|No| D[Stop]
      </div>
    </section>
    <!-- SLIDES END -->

  </div>
</div>

<script src="/lib/reveal/reveal.js"></script>
<script src="/lib/reveal/plugin/notes.js"></script>
<script src="/lib/reveal/plugin/zoom.js"></script>
<script src="/lib/reveal/plugin/search.js"></script>
<script src="/lib/chart/chart.umd.js"></script>
<script src="/lib/mermaid/mermaid.min.js"></script>
<!-- Served by the renderer for this artifact only; hands the view token to
     dra-content.js, which needs it to authorise its analytics beacon. Must
     come first: dra-content.js reads window.DRA_TOKEN at load time. -->
<script src="_token.js"></script>
<script src="/lib/dra-content.js"></script>
<script src="/lib/dra-present.js"></script>
<script src="app.js"></script>
</body>
</html>
